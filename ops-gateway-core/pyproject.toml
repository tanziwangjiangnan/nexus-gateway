[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-gateway-core"
version = "0.3.9"
description = "Hermes 网关核心：配置、Fiber 运行时、API、操作层（合并包）"
requires-python = ">=3.10"

dependencies = [
    "ops-provider-router",
    "ops-fiber-tree",
    "fastapi",
    "uvicorn",
    "httpx",
    "PyYAML",
    "prometheus-client",
]

[tool.setuptools.packages.find]
include = ["ops_gateway_core*"]

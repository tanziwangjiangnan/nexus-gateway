# nexus-gateway — ACK Ingress（对外暴露）
#
# 前置条件: ACK 已安装 ingress-nginx
#   kubectl apply -f deploy/k8s/ingress.yaml
#
# 将网关通过域名对外暴露, 自动 TLS 证书请配置对应 annotation

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-gateway
  namespace: nexus-gateway
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - host: hermes.jiangnande.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-gateway
                port:
                  number: 8646
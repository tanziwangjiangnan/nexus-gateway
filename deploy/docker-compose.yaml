# nexus-gateway — Docker Compose 部署（本地开发）
#
# 启动:   docker compose -f deploy/docker-compose.yaml up -d
# 停止:   docker compose -f deploy/docker-compose.yaml down
# 日志:   docker compose -f deploy/docker-compose.yaml logs -f
# 重建:   docker compose -f deploy/docker-compose.yaml up -d --build
#
# 前置条件:
#   - 构建镜像: docker build -t nexus-gateway:v3.10 .
#   - 在 /root/.hermes/.env 中配置 provider 密钥

services:
  nexus-gateway:
    image: nexus-gateway:v3.10
    container_name: nexus-gateway
    restart: unless-stopped
    ports:
      - "8646:8646"
    environment:
      TZ: Asia/Shanghai
      GATEWAY_HOST: 0.0.0.0
    env_file:
      - /root/.hermes/.env
    volumes:
      # 挂载项目根目录（可写），与裸机进程路径一致
      - ../:/app
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8646/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
# nexus-gateway — Docker Compose 一键部署
#
# 启动:   docker compose -f deploy/docker-compose.yaml up -d
# 停止:   docker compose -f deploy/docker-compose.yaml down
# 日志:   docker compose -f deploy/docker-compose.yaml logs -f
#
# 前置条件:
#   - 在 .env 中配置 provider 密钥（${VAR} 引用，无需硬编码）
#   - 需要容器发现/日志功能时，需挂载 /var/run/docker.sock

services:
  nexus-gateway:
    image: nexus-gateway:v3.9
    container_name: nexus-gateway
    restart: unless-stopped
    ports:
      - "8646:8646"            # API 端口（对外）
      - "8649:8649"            # 直连端点（nginx 重写用）
    environment:
      # provider 密钥 — 从宿主机环境变量注入（无硬编码）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      QFG_GPT_KEY: ${QFG_GPT_KEY}
      SCNET_TP_KEY: ${SCNET_TP_KEY}
      XIAOMI_KEY: ${XIAOMI_KEY}
      GATEWAY_KEY: ${GATEWAY_KEY}
      TZ: Asia/Shanghai
    volumes:
      # 配置与数据挂载（宿主机路径可改）
      - ./config/gateway.yaml:/app/gateway.yaml:ro
      - ./data:/app/data
      # 容器化智能体发现/日志（可选）
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8646/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge